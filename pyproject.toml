[project]
name = "health-agents"
version = "0.1.0"
description = "Console LangGraph app routing health queries to a summarizer, report builder, or Q/A agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.0.5",
    "langchain-core>=1.6,<2",
    "langchain-groq==1.1.3",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "pydantic>=2.9",
]

[project.scripts]
health-agents = "health_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
